name: cuc_research_portal
description: Portal de investigación para Clubes Universitarios de Ciencias.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  file_picker: ^10.3.7
  flutter_riverpod: ^3.3.1
  go_router: ^17.2.3
  image_picker: ^1.2.1
  open_filex: ^4.7.0
  path_provider: ^2.1.6
  shared_preferences: ^2.5.3
  supabase_flutter: ^2.12.4
  url_launcher: ^6.3.2
  flutter_localizations:
    sdk: flutter
  cached_network_image: ^3.4.1
  image_gallery_saver_plus: ^5.1.1
  flutter_markdown: ^0.7.7+1
  archive: ^4.0.9
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - .env

  # Descarga Space Grotesk desde Google Fonts o incluye los archivos en assets/fonts/
  # https://fonts.google.com/specimen/Space+Grotesk

  # Si no se agregan fuentes locales, comente la sección de fonts o use google_fonts.
  # Alternativa sin archivos locales: usa el paquete google_fonts
  # dependencies:
  #   google_fonts: ^6.1.0
  # Y en AppTheme reemplaza fontFamily: 'SpaceGrotesk' por
  # textTheme: GoogleFonts.spaceGroteskTextTheme(...)

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/cuc_ico_solido.png"
  min_sdk_android: 21
  adaptive_icon_background: "#6EE718"
  adaptive_icon_foreground: "assets/icon/cuc_ico_solido.png"
